stages:
  - lint
  - build
  - test

lint-frontend:
  stage: lint
  timeout: 10 minutes
  rules:
    - changes:
      - apps/web/**/*
      - 'package.json'
      - 'package-lock.json'
      - '.gitlab-ci.yml'
  script:
    - cd apps/web
    - npm install -g eslint
    - eslint --init
    - eslint src/**/*.ts
