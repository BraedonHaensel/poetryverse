image: node:20

stages:
  - lint
  - build
  - test

lint-frontend:
  stage: lint
  timeout: 10 minutes
  rules:
    - changes:
      - apps/web/**/*
      - 'package.json'
      - 'package-lock.json'
      - '.gitlab-ci.yml'
  script:
    - cd apps/web
    - npm ci
    - npm run lint

lint-backend:
  stage: lint
  timeout: 10 minutes
  rules:
    - changes:
      - apps/api/**/*
      - 'package.json'
      - 'package-lock.json'
      - '.gitlab-ci.yml'
  script:
    - cd apps/api
    - npm ci
    - npm run lint
