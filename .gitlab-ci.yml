name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-web:
    name: Lint web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    rules:
      - changes:
        - apps/web/**/*
        - 'package.json'
        - 'package-lock.json'
        - '.gitlab-ci.yml'
    script:
      - echo "testing lint-frontend"